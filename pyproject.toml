[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beau-graphique"
version = "0.2.0"
description = "Wrapper matplotlib en français pour des graphiques soignés, prêts pour la présentation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numpy",
]

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]

# Modules plats (pas un sous-paquet) : `import beau_graphique`, `import narratif`,
# `import pipeline`, `import themes` fonctionnent à l'identique en mode "copie de
# fichiers" (fichiers à plat dans un projet) et en mode "pip install" (modules
# installés à la racine de site-packages). Aucun import relatif n'est nécessaire.
# beau_graphique_mckinsey / beau_graphique_layout : fonctions extraites de
# beau_graphique.py (fichier devenu trop volumineux) — beau_graphique.py les
# réimporte à sa fin, donc `from beau_graphique import dot_plot_comparatif`
# continue de fonctionner sans changement pour l'utilisateur final.
[tool.setuptools]
py-modules = [
    "beau_graphique", "beau_graphique_mckinsey", "beau_graphique_layout",
    "narratif", "pipeline", "themes", "export",
]

[tool.setuptools.package-dir]
"" = "src/beau_graphique"
